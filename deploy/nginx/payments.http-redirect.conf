# Replace conf.d/payments.conf after TLS is issued (keeps ACME on HTTP, redirects app traffic).

upstream payments_prod {
    server app-prod:3001;
    keepalive 8;
}

upstream payments_staging {
    server app-staging:3002;
    keepalive 8;
}

server {
    listen 80;
    server_name payments.consentmd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name payments.staging.consentmd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
