# HTTP — ACME webroot + app proxy (HTTPS in payments-ssl.conf once certs exist)

upstream payments_prod {
    server app-prod:3001;
    keepalive 8;
}

upstream payments_staging {
    server app-staging:3002;
    keepalive 8;
}

server {
    listen 80;
    server_name payments.consentmd.com;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://payments_prod;
    }
}

server {
    listen 80;
    server_name payments.staging.consentmd.com;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://payments_staging;
    }
}
