# Development — local Redis + hot-reload app
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: consentmd-payments-dev
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    env_file:
      - .env
    environment:
      NODE_ENV: DEV
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - consentmd-payments-network

  redis:
    image: redis:7-alpine
    container_name: consentmd-payments-redis-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PUBLISH_PORT:-6379}:6379'
    command: >
      sh -c "redis-server
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
      --appendonly yes"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - consentmd-payments-network

volumes:
  redis_dev_data:
    driver: local

networks:
  consentmd-payments-network:
    driver: bridge
